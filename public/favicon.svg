<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient representing corporate trust -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Gold Trim Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cyan Compass Needle -->
    <linearGradient id="favNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield with metal edge -->
  <circle cx="64" cy="64" r="58" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="4" />
  
  <!-- Outer tick rings -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="2 4" />

  <!-- Cardinal indicators -->
  <polygon points="64,18 69,26 59,26" fill="#f8fafc" />
  <circle cx="64" cy="110" r="2" fill="#64748b" />
  <circle cx="110" cy="64" r="2" fill="#64748b" />
  <circle cx="18" cy="64" r="2" fill="#64748b" />

  <!-- Active Compass Needle pointing Northeast -->
  <g transform="rotate(45 64 64)">
    <!-- Cyan Needle active side -->
    <path d="M 64,14 L 71,64 L 64,59 Z" fill="url(#favNeedle)" />
    <!-- Blue shadow side -->
    <path d="M 64,14 L 57,64 L 64,59 Z" fill="#0369a1" />
    
    <!-- Tail pointer -->
    <path d="M 64,114 L 70,64 L 64,69 Z" fill="#fbbf24" />
    <path d="M 64,114 L 58,64 L 64,69 Z" fill="#b45309" />
  </g>

  <!-- Center Pivot Pin -->
  <circle cx="64" cy="64" r="6" fill="#020617" stroke="url(#favGold)" stroke-width="1.5" />
  <circle cx="64" cy="64" r="3" fill="#fbbf24" />
</svg>
